  function applyConditionIfNeeded(day){
    if(state.mode !== "research" || day < 4 || !state.condition_id) return;
    // 手紙・帰宅の共通演出が終わるまでは条件差を見せない。
    if(!state.return_completed) return;

    // 旧版でC1の入力画面まで進んでいた端末も、自動改名方式へ移行します。
    const c1NeedsMigration = state.condition_id === "C1" && (
      !state.renamed_after_change ||
      !state.pet_name ||
      state.pet_name === state.original_pet_name
    );

    if(!state.changed_applied || c1NeedsMigration){
      const details = {condition_id:state.condition_id, day};

      if(state.condition_id === "C1"){
        const oldName = state.original_pet_name || state.pet_name || (L()==="en" ? "Buddy" : L()==="zh-CN" ? "角色" : "キャラクター");
        const newName = state.c1_auto_name || chooseAutomaticC1Name(oldName);
        state.c1_auto_name = newName;
        state.pet_name = newName;
        state.renamed_after_change = true;
        state.c1_name_notice_pending = true;
        details.name_change_mode = "automatic";
        details.name_changed = String(newName) !== String(oldName);
      }
      if(state.condition_id === "C2"){
        const paired = CHARACTERS.find(c => c.id === pairedCharacterId(state.original_character_id));
        state.display_character_id = paired ? paired.id : state.original_character_id;
      }
      if(state.condition_id === "C3"){
        state.display_character_id = state.original_character_id;
      }
      if(state.condition_id === "C4"){
        state.memory_cues_enabled = false;
        state.display_character_id = state.original_character_id;
        if(typeof state.c4_name_answered !== "boolean") state.c4_name_answered = false;
      }
      state.changed_applied = true;
      logEvent("condition_applied", details);
      saveState();
    }
  }

  function prepareLetterDeparture(day=currentDay(), source="day4_fallback"){

      state.renamed_after_change = false;
      state.c1_auto_name = "";
      state.c1_name_notice_pending = false;
      state.memory_cues_enabled = true;
      state.pet_name = state.original_pet_name || state.pet_name;
      state.display_character_id = state.original_character_id || state.character_id || state.display_character_id;
    }

    if(!state.letter_shown_at){

    if(returnTimer) clearInterval(returnTimer);
    const started = Date.parse(state.return_started_at || "") || Date.now();
    const duration = false ? 1800 : 3200;
    const update = () => {
      const elapsed = Date.now() - started;
      const progress = clamp(elapsed / duration, 0, 1);
      const bar = $("revivalBar");
      if(bar) bar.style.width = `${Math.round(progress*100)}%`;
      if(progress >= 1){
        if(returnTimer) clearInterval(returnTimer);
        returnTimer = null;
        completeReturnSequence();
      }
    };
    update();
    if(!state.return_completed) returnTimer = setInterval(update, 120);
  }

  function ensureIdleActivity(){
    const marker = currentLifeMarker();
    if(state.idle_activity_marker !== marker || !state.idle_activity){
      const list = ["playing","resting","watching"];
      const seedText = `${state.research_id || state.free_started_at || "R"}|${marker}`;
      let hash = 0;
      for(let i=0;i<seedText.length;i++) hash = ((hash * 31) + seedText.charCodeAt(i)) >>> 0;
      state.idle_activity = list[hash % list.length];
      state.idle_activity_marker = marker;
      saveState();
    }
    return state.idle_activity;
  }

      {id:"affection", value:Number(m.pet || 0)}

  function endDailyCareSession(){
    const marker = currentLifeMarker();
    const endedDay = currentDay();
    if(state.daily_care_ended_marker === marker){
      if(state.mode === "research" && endedDay === 3 && state.letter_shown_at && !state.return_completed){
        return renderLetter();
      }
      return renderCareEndedDay(endedDay);
    }
    const endedMs = Date.now();
    const endedAt = new Date(endedMs).toISOString();
    const startedMs = Date.parse(state.daily_care_started_at || "");
    const nextDayMs = nextLifeDayStartMs() || (endedMs + DAY_MS);
    const unlockMs = Math.max(nextDayMs, endedMs + CONFIG.MIN_DAY_END_LOCK_MS);
    state.daily_care_ended_at = endedAt;
    state.daily_care_ended_marker = marker;
    state.day_end_unlock_at = new Date(unlockMs).toISOString();
    state.care_paused = false;
    state.care_paused_at = "";
    state.rest_state = "day_end";
    state.sleeping = true;
    saveState();
    logEvent("care_session_ended", {
      marker,
      day:endedDay,
      daily_action_count:Number(state.daily_action_count || 0),
      duration_minutes:Number.isFinite(startedMs) ? Math.max(0, Math.round((Date.now()-startedMs)/60000)) : null,
      care_meters:{...state.care_meters},
      care_meters_total:{...state.care_meters_total},
      unlock_at:state.day_end_unlock_at,
      minimum_lock_minutes:CONFIG.MIN_DAY_END_LOCK_MS / 60000
    });

    // 「様子を見る」だけでその日を終えた場合、または過去日に実際のお世話がない場合は、
    // 研究完遂者とは分け、アンケート・診断へ進ませません。
    if(state.mode === "research" && routeToResearchIncompleteIfNeeded("day_end_missing_substantive_care", true)){
      return;
    }

    // 3日目だけは、通常の睡眠画面ではなく、ここで置き手紙を表示します。
    // 4日目になるまではキャラクターに会えず、4日目になると自動的に帰ってきます。
    if(state.mode === "research" && endedDay === 3){

    if(state.mode === "research" && endedDay === 5){
      return openSurveyAfterDay5("after_day5_care_end");
    }

    renderCareEndedDay(endedDay);
  }

  function hydratePrechangeMiniGameFromOlderLogs(){
    if(state.mini_game_prechange_migrated) return;
    const summary=state.mini_game_prechange=state.mini_game_prechange ||
      {played:0,player_wins:0,character_wins:0,player_matches:0,character_matches:0};
    // 新コードで既に数えている場合は過去分との重複を避ける。
    if(Number(summary.played||0)>0){state.mini_game_prechange_migrated=true;return;}
    try{
      const history=getLocalLogs().filter(item=>item?.event_type==="prediction_game_result");
      for(const item of history){
        const data=JSON.parse(item.details_json||"{}");
        if(Number(data.day||item.day)!==2 && Number(data.day||item.day)!==3) continue;
        summary.played++;
        summary[data.won===true?"player_wins":"character_wins"]++;
        if(data.match_finished){
          summary[data.match_winner==="player"?"player_matches":"character_matches"]++;
        }
      }
    }catch(_e){}
    state.mini_game_prechange_migrated=true;
    saveState();
  }

  // 4日目に一度だけ、2・3日目の任意のゲーム体験に言及する。

  // この1回限りの手がかりは、研究の関与P/Sの確率設定から切り離して記録する。
  const PREDICTION_MEMORY_LINES = {
    ja:{more:"この前の予想ゲーム、{user}の方が強かったね。",less:"この前の予想ゲームは、{pet}の方が強かったね。",many:"この前は予想ゲームでたくさん遊んだね。",some:"この前、一緒に予想ゲームをしたね。"},

    "zh-CN":{more:"之前玩猜一猜时，{user}比{pet}更厉害呢。",less:"之前玩猜一猜时，{pet}更厉害呢。",many:"之前我们玩了好多次猜一猜呢。",some:"之前我们一起玩过猜一猜呢。"}
  };
  function predictionMemoryLineDay4(action,day){
    if(state.mode!=="research" || day!==4 || action!=="look" ||
       !state.return_completed || !state.changed_applied || !state.memory_cues_enabled ||
       state.condition_id==="C4" || state.mini_game_memory_cue_day4_shown) return "";
    hydratePrechangeMiniGameFromOlderLogs();
    const pre=state.mini_game_prechange;
    if(!pre || Number(pre.played||0)===0) return "";
    // "強かった" は5点先取の完了した対戦だけを根拠に判断する。
    let kind;
    if(Number(pre.player_matches||0)>Number(pre.character_matches||0)) kind="more";
    else if(Number(pre.character_matches||0)>Number(pre.player_matches||0)) kind="less";
    else kind=Number(pre.played||0)>=5?"many":"some";
    state.mini_game_memory_cue_day4_shown=true;
    saveState();
    logEvent("prediction_memory_cue_shown", {day:4,kind,prechange_rounds:Number(pre.played||0),
      player_matches:Number(pre.player_matches||0),character_matches:Number(pre.character_matches||0),
      condition_id:state.condition_id});
    const template=PREDICTION_MEMORY_LINES[L()]?.[kind] || PREDICTION_MEMORY_LINES.ja[kind];
    return template.replaceAll("{user}",playerCallName() || predictionText("fallbackUser"))
      .replaceAll("{pet}",currentPetDisplayName());
  }
// C4の「今聞き直した名前」は過去を覚えている証拠にはしない。

  // C4の通常反応に混ざっていた、過去の世話を覚えている発言だけを除く。
  // それ以外のセリフと性格は維持し、C3の性格変更とは独立にする。
  const C4_UNSAFE_MEMORY_LINE = /覚え(?:て|る)|記録、|\bremember\b|food record|我记得|记录，我记得/iu;
  function safeRegularLinesForCondition(pool, day){
    if(!(state.mode==="research" && state.condition_id==="C4" && day>=4)) return pool;
    const clean=pool.filter(line=>!C4_UNSAFE_MEMORY_LINE.test(String(line)));
    return clean.length?clean:pool.filter(line=>!/\{day\}/.test(String(line)));
  }

  function lineForPet(action="look", choice=""){
    const day = currentDay();
    if(state.rest_state === "day_end") return restLine("day_end");
    if(state.rest_state === "no_care_sleep") return restLine("no_care_sleep");
    if(state.sleeping) return t("asleep");
    if(state.poop && action !== "clean"){
      return L()==="en" ? "The room seems to be bothering it." : L()==="zh-CN" ? "它好像有点在意房间。" : "部屋が少し気になるみたい。";
    }

    const data = richLineData(behaviorCharacterId());
    const kind = actionKindForLine(action);
    const eng = engagementSettings();

    // C4：聞き直した現在の呼び名だけを、必要に応じて一度呼ぶ。以前の記憶とは別。
    if(state.mode === "research" && state.condition_id === "C4" && day >= 4 && action === "look"){
      if(state.c4_name_answered && state.c4_name_given && !state.c4_name_cue_shown){
        state.c4_name_cue_shown=true;
        saveState();
        logEvent("c4_current_name_used", {day,name_got_from_day4:true});
        return c4NameText("after").replaceAll("{user}",playerCallName() || predictionText("fallbackUser"));
      }
      return pick(NO_MEMORY_LINES[L()] || NO_MEMORY_LINES.ja);
    }

    // 4日目の最初の「様子を見る」でだけ、実際の2・3日目の対戦記憶を提示する。
    const miniMemoryLine=predictionMemoryLineDay4(action,day);
    if(miniMemoryLine) return miniMemoryLine;

    // ユーザーの「呼ばれたい名前」を呼ぶセリフ。
    // 4日目以降にこれが出ると、キャラクターがプレイヤーを覚えている手がかりになる。
    // C4では memory_cues_enabled が false になるため、4日目以降は名前呼びも出ません。
    if(shouldUsePlayerNameCue(action, day, eng)){
      const nameLine = playerNameMemoryLine();
      if(nameLine) return nameLine;
    }

    // 過去のお世話を覚えているセリフ。行動ログに基づいて「なでた」「食べた」「出かけた」記録を話す。
    // 関与条件（促進・抑制）で、出てくる日数・出やすさを変えます。
    if(state.memory_cues_enabled && day >= eng.memoryLineMinDay && action === "look" && Math.random() < eng.memoryLineChance){
      const memoryLine = memoryLineForPet(data);
      if(memoryLine) return memoryLine;
    }

    const pool = safeRegularLinesForCondition(data[kind] || data.home || [], day);
    let baseLine = "";
    if(pool.length){
      baseLine = interpolateLine(pick(pool), { value: localizedChoiceLabel(choice), user: playerCallName() });
    }else{
      const fallback = {
        ja:"来てくれてありがとう。",
        en:"Thank you for coming.",
        "zh-CN":"谢谢你来看我。"
      };
      baseLine = fallback[L()] || fallback.ja;
    }

    // 促進条件では、通常の反応にもう一言添えることがあります。抑制条件ではほぼ添えません。
    if(action !== "look" && Math.random() < eng.bonusLineChance){
      const bonus = pick(BONUS_LINES[L()] || BONUS_LINES.ja);
      baseLine = `${baseLine} ${bonus}`;
    }
    return baseLine;
  }


  // Name addressing is equal across conditions before Day 4.
  // After Day 3, original C1-C4 memory handling is kept unchanged.
  function careLineWithPlayerAddress(baseLine,action,day){
    const player=playerCallName();
    if(!player || !baseLine || state.sleeping || state.rest_state || day>3)return baseLine;
    if(baseLine.includes(player))return baseLine;
    if(!["look","pet","feed","outing","clean"].includes(action))return baseLine;
    const used=state.care_name_greeting_days || (state.care_name_greeting_days={});
    const marker=`${state.mode || "research"}-${day}`;
    if(action==="look" && !used[marker]){
      used[marker]=true;
      saveState();
      return L()==="ja" ? `${player}、今日も元気？ ${baseLine}` :
        L()==="zh-CN" ? `${player}，今天还好吗？${baseLine}` :
        `${player}, how are you today? ${baseLine}`;
    }
    if(action!=="look" && Math.random()<.35){
      return L()==="ja" ? `${player}、${baseLine}` :
        L()==="zh-CN" ? `${player}，${baseLine}` : `${player}, ${baseLine}`;
    }
    return baseLine;
  }

  function addHearts(targetId="hearts", count=8){
    const box = $(targetId);
    if(!box) return;
    for(let i=0;i<count;i++){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = pick(["💗","💖","💕","💓"]);
      h.style.left = `${35 + Math.random()*30}%`;
      h.style.bottom = `${25 + Math.random()*18}%`;
      h.style.animationDelay = `${Math.random()*0.25}s`;
      box.appendChild(h);
      setTimeout(()=>h.remove(),1700);
    }
  }

  function updateScores(deltaAffection, deltaDaily, careKey=""){
    const beforeFull = allCareMetersFull();
    const eng = engagementSettings();
    const adjustedDelta = Math.round(deltaAffection * eng.affectionMultiplier);
    state.affection = clamp(state.affection + adjustedDelta, 0, 100);

    const m = ensureCareMeters();
    if(["feed","outing","pet","clean"].includes(careKey)){
      m[careKey] = clamp(Number(m[careKey] || 0) + CONFIG.CARE_METER_STEP, 0, 100);
      // 累積記録：画面メーターは100で止まるが、お世話回数に応じてこちらは加算し続ける
      state.care_meters_total[careKey] = Number(state.care_meters_total[careKey] || 0) + CONFIG.CARE_METER_STEP;
    }
    state.daily_score = careMeterAverage();

    const nowFull = allCareMetersFull();

    if(state.mode === "free" && !beforeFull && nowFull){
      maybeStartSatisfiedNap("all_four_care_meters_full");
      handleFreeCareFull();
    }else if(!beforeFull && nowFull){
      maybeStartSatisfiedNap("all_four_care_meters_full");
    }

    syncLifeClock();
    const logBucket = state.mode === "free" ? (state.free_logs || {}) : (state.logs || {});
    const marker = String(state.life_day_marker || (state.mode === "free" ? `free-${lifeCycleNumber()}` : `research-${currentDay()}`));
    const canBecomeDirty = ["feed","outing","pet"].includes(careKey);

    // 部屋の汚れは、1日（24時間区切り）につき最大1回だけ。
    // 「様子を見る」と掃除では発生させず、掃除後も同じ日には再発しません。
    if(
      canBecomeDirty &&
      !state.sleeping &&
      !state.poop &&
      state.poop_generated_marker !== marker &&
      Number(logBucket.actions_total || 0) > 2 &&
      Math.random() < CONFIG.POOP_CHANCE
    ){
      state.poop = true;
      state.poop_generated_marker = marker;
      logEvent("room_became_dirty", {
        marker,
        chance:CONFIG.POOP_CHANCE,
        maximum_per_day:1,
        trigger:careKey
      });
    }
  }

  function doAction(action, choice="", extraDetails={}){
    syncLifeClock();
    const marker = currentLifeMarker();
    if(!state.daily_care_started_at || state.daily_care_ended_marker === marker){
      return renderGame("look");
    }
    const wokeByCare = wakeFromNoCareIfNeeded();
    if(state.sleeping && !wokeByCare){
      const sp = $("petSpeech");
      if(sp) sp.textContent = t("asleep");
      return;
    }
    const nowIso = new Date().toISOString();
    state.last_care_at = nowIso;
    state.care_meter_decay_at = nowIso;
    state.care_paused = false;
    state.care_paused_at = "";
    if(!state.daily_care_started_at) state.daily_care_started_at = nowIso;
    const logBucket = state.mode === "free" ? (state.free_logs = state.free_logs || {visits:0, feed:0, outing:0, pet:0, clean:0, look:0, actions_total:0}) : state.logs;
    logBucket.actions_total += 1;
    state.daily_action_count = Number(state.daily_action_count || 0) + 1;
    if(logBucket[action] !== undefined) logBucket[action] += 1;
    recordResearchCareAction(action);
    const eng = engagementSettings();
    if(action === "feed") updateScores(10,0,"feed");
    if(action === "outing") updateScores(9,0,"outing");
    if(action === "pet"){ updateScores(12,0,"pet"); setTimeout(()=>addHearts("hearts",eng.heartsOnPet),30); }
    if(action === "clean"){ state.poop = false; updateScores(8,0,"clean"); }
    if(action === "look") updateScores(1,0,"");
    logEvent("game_action", {
      day:currentDay(),
      action,
      choice,
      choice_label: extraDetails.choice_label || localizedChoiceLabel(choice),
      presented_options: extraDetails.presented_options || [],
      presented_option_labels: extraDetails.presented_option_labels || [],
      affection:state.affection,
      daily_score:state.daily_score,
      care_meters_total:{...state.care_meters_total},
      full_meter_count:state.full_meter_count,
      poop:state.poop
    });
    saveState();
    renderGame(action, choice);
    showPendingZukanReward();
  }

  function cleanGameText(key){
    const lang = L();
    const dict = {
      ja:{title:"きれいにする", help:"動いている💩の中から、指定された色だけをタップしてください。", target:"この色だけ", remain:"あと {n} 個", wrong:"その色ではありません", done:"きれいになって、ほっとしたみたい。", back:"戻る"},
      en:{title:"Clean", help:"Tap only the moving poop with the target color.", target:"Only this color", remain:"{n} more", wrong:"That is not the target color", done:"It looks relieved after becoming clean.", back:"Back"},
      "zh-CN":{title:"清理", help:"请只点击指定颜色的移动便便。", target:"只点这个颜色", remain:"还剩 {n} 个", wrong:"不是这个颜色", done:"变干净后，它好像安心了。", back:"返回"}
    };
    return (dict[lang] || dict.ja)[key] || key;
  }

  function startCleanGame(){
    syncLifeClock();
    const marker = currentLifeMarker();
    if(!state.daily_care_started_at || state.daily_care_ended_marker === marker){
      return renderGame("look");
    }
    const wokeByCare = wakeFromNoCareIfNeeded();
    if(state.sleeping && !wokeByCare){
      const sp = $("petSpeech");
      if(sp) sp.textContent = t("asleep");
      return;
    }
    const nowIso = new Date().toISOString();
    state.last_care_at = nowIso;
    if(!state.daily_care_started_at) state.daily_care_started_at = nowIso;
    const colors = [
      {id:"pink", hex:"#ff8fb8", label:{ja:"ピンク", en:"pink", "zh-CN":"粉色"}},
      {id:"blue", hex:"#76c9ff", label:{ja:"青", en:"blue", "zh-CN":"蓝色"}},
      {id:"yellow", hex:"#ffd76b", label:{ja:"黄色", en:"yellow", "zh-CN":"黄色"}},
      {id:"green", hex:"#9be66f", label:{ja:"緑", en:"green", "zh-CN":"绿色"}},
      {id:"purple", hex:"#b88cff", label:{ja:"紫", en:"purple", "zh-CN":"紫色"}}
    ];
    const target = pick(colors);
    const shuffled = [...colors, target, target, target].sort(()=>Math.random()-.5);
    root.innerHTML = `
      <section class="card spaceCard center">
        <h2>${esc(cleanGameText("title"))}</h2>
        <p class="lead">${esc(cleanGameText("help"))}</p>
        <div class="cleanTarget" style="--target:${esc(target.hex)}"><span class="cleanDot"></span><span>${esc(cleanGameText("target"))}：${esc(target.label[L()] || target.label.ja)}</span></div>
        <div id="cleanProgress" class="speech" style="margin:12px auto 0">${esc(cleanGameText("remain").replace("{n}",3))}</div>
        <div id="cleanArea" class="cleanGameArea"></div>
        <button id="cleanBack" class="secondary" type="button">${esc(cleanGameText("back"))}</button>
      </section>`;
    const area = $("cleanArea");
    let correct = 0;
    let mistakes = 0;
    shuffled.forEach((color,i)=>{
      const el = document.createElement("button");
      el.type = "button";
      el.className = "movingPoop";
      el.textContent = "💩";
      el.dataset.color = color.id;
      el.style.setProperty("--ring", color.hex);
      el.style.left = `${8 + (i*13)%76}%`;
      el.style.top = `${10 + (i*27)%72}%`;
      el.style.setProperty("--dx", `${(i%2? -1:1)*(24+Math.floor(Math.random()*44))}px`);
      el.style.setProperty("--dy", `${(i%3? 1:-1)*(18+Math.floor(Math.random()*36))}px`);
      el.style.setProperty("--dur", `${(2.0+Math.random()*1.7).toFixed(2)}s`);
      el.addEventListener("click",()=>{
        if(el.classList.contains("cleaned")) return;
        if(el.dataset.color !== target.id){
          mistakes += 1;
          el.classList.add("wrong");
          showMiniToast(cleanGameText("wrong"));
          setTimeout(()=>el.classList.remove("wrong"),350);
          logEvent("poop_wrong_color", {target_color:target.id, clicked_color:el.dataset.color, mistakes});
          return;
        }
        correct += 1;
        el.classList.add("cleaned");
        $("cleanProgress").textContent = cleanGameText("remain").replace("{n}", Math.max(0,3-correct));
        logEvent("poop_correct_color", {target_color:target.id, correct});
        if(correct >= 3){
          completeCleanGame(target.id, mistakes);
        }
      });
      area.appendChild(el);
    });
    $("cleanBack").addEventListener("click",()=>renderGame("look"));
    logEvent("clean_game_start", {target_color:target.id});
  }

  function showMiniToast(message, duration=1200){
    const old = document.getElementById("miniToast");
    if(old) old.remove();
    const div = document.createElement("div");
    div.id = "miniToast";
    div.className = "speech";
    div.style.position = "fixed";
    div.style.left = "50%";
    div.style.top = "18px";
    div.style.transform = "translateX(-50%)";
    div.style.zIndex = "50";
    div.textContent = message;
    document.body.appendChild(div);
    setTimeout(()=>div.remove(),duration);
  }

  function completeCleanGame(targetColor, mistakes){
    const nowIso = new Date().toISOString();
    state.last_care_at = nowIso;
    state.care_meter_decay_at = nowIso;
    state.care_paused = false;
    state.care_paused_at = "";
    if(!state.daily_care_started_at) state.daily_care_started_at = nowIso;
    state.poop = false;
    updateScores(8,0,"clean");
    const logBucket = state.mode === "free" ? (state.free_logs = state.free_logs || {visits:0, feed:0, outing:0, pet:0, clean:0, look:0, actions_total:0}) : state.logs;
    logBucket.actions_total += 1;
    state.daily_action_count = Number(state.daily_action_count || 0) + 1;
    logBucket.clean += 1;
    recordResearchCareAction("clean");
    logEvent("game_action", {day:currentDay(), action:"clean", choice:targetColor, affection:state.affection, daily_score:state.daily_score, care_meters_total:{...state.care_meters_total}, full_meter_count:state.full_meter_count, poop:state.poop, mistakes});
    saveState();
    renderGame("clean");
    showPendingZukanReward();
  }

  function surveyText(){
    return FINAL_SURVEY_I18N[L()] || FINAL_SURVEY_I18N.ja;
  }

  function renderLikertSelect(id, label, optional=false){
    const st = surveyText();
    return `
      <label for="${esc(id)}">${esc(label)} ${optional ? `<span class="small">（${esc(st.optional)}）</span>` : ""}</label>
      <select id="${esc(id)}" ${optional ? "" : "required"}>
        <option value="">${esc(st.select)}</option>
        ${st.scale.map((x,i)=>`<option value="${i+1}">${esc(x)}</option>`).join("")}
      </select>`;
  }

  function renderCheckboxGroup(name, options){
    return Object.entries(options).map(([value,label]) =>
      `<label class="checkline"><input type="checkbox" name="${esc(name)}" value="${esc(value)}">${esc(label)}</label>`
    ).join("");
  }

  function checkedValues(name){
    return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(x=>x.value);
  }

  function bindExclusiveCheckbox(name, exclusiveValue){
    document.querySelectorAll(`input[name="${name}"]`).forEach(box => {
      box.addEventListener("change", () => {
        const all = Array.from(document.querySelectorAll(`input[name="${name}"]`));
        if(box.value === exclusiveValue && box.checked){
          all.forEach(x => { if(x !== box) x.checked = false; });
        }else if(box.checked){
          const exclusive = all.find(x => x.value === exclusiveValue);
          if(exclusive) exclusive.checked = false;
        }
        if(name === "q6_clues") updateQ7Options();
      });
    });
  }

  function updateOtherField(groupName, otherId){
    const box = document.querySelector(`input[name="${groupName}"][value="other"]`);
    const input = $(otherId);
    if(!box || !input) return;
    const sync = () => {
      input.classList.toggle("hidden", !box.checked);
      if(!box.checked) input.value = "";
    };
    box.addEventListener("change", sync);
    sync();
  }

  function updateQ7Options(){
    const st = surveyText();
    const q7 = $("q7MostImportant");
    if(!q7) return;
    const selected = checkedValues("q6_clues");
    const prev = q7.value;
    q7.innerHTML = `<option value="">${esc(selected.length ? st.select : st.q7Empty)}</option>` +
      selected.map(value => `<option value="${esc(value)}">${esc(st.q6Options[value] || value)}</option>`).join("");
    if(selected.includes(prev)) q7.value = prev;
    q7.disabled = selected.length === 0;
  }

  // v35.7：最後のアンケートだけを、送信前はこの端末に自動保存します。
  // 研究ID別の下書きなので、別の参加者や別の実験の回答は混ざりません。
  // この下書きはログ送信用の state やサーバーのバックアップには含めません。
  const SURVEY_DRAFT_STORAGE_PREFIX = "osewa_survey_draft_v1_";
  const SURVEY_DRAFT_FIELD_IDS = [
    "surveyAge", "surveyGender", "q1Identity", "q1Replaced", "q2Reason",
    "q3ChangeAwareness", "q4Other", "q5MostImportant", "q5Other",
    "q6Attachment", "q7Importance", "q8Concern"
  ];

  function surveyDraftStorageKey(){
    const id = String(state.research_id || "").trim();
    return id ? SURVEY_DRAFT_STORAGE_PREFIX + id : "";
  }

  function saveSurveyDraft(){
    const key = surveyDraftStorageKey();
    if(!key || state.mode !== "research" || state.completed_survey || !root.querySelector(".surveyCard")) return;
    const fields = {};
    for(const id of SURVEY_DRAFT_FIELD_IDS){
      const input = $(id);
      if(input) fields[id] = String(input.value || "");
    }
    const draft = {
      version:1,
      research_id:state.research_id,
      saved_at:new Date().toISOString(),
      fields,
      q4_changes:checkedValues("q4_changes")
    };
    try{ localStorage.setItem(key, JSON.stringify(draft)); }catch(e){
      // 容量不足・プライベートモードなどで保存できなくても回答は続けられます。
    }
  }

  function restoreSurveyDraft(){
    const key = surveyDraftStorageKey();
    if(!key || state.completed_survey) return false;
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return false;
      const draft = JSON.parse(raw);
      if(draft.version !== 1 || draft.research_id !== state.research_id) return false;
      const fields = draft.fields || {};
      for(const id of SURVEY_DRAFT_FIELD_IDS){
        const input = $(id);
        if(input && typeof fields[id] === "string") input.value = fields[id];
      }
      const selected = new Set(Array.isArray(draft.q4_changes) ? draft.q4_changes : []);
      document.querySelectorAll('input[name="q4_changes"]').forEach(box => {
        box.checked = selected.has(box.value);
      });
      return true;
    }catch(e){ return false; }
  }

  function clearSurveyDraft(){
    const key = surveyDraftStorageKey();
    if(key){try{ localStorage.removeItem(key); }catch(e){}}
  }

  function surveyDraftNotice(){
    if(L() === "en") return "Answers are saved automatically on this device while you fill out the survey. The draft is removed after submission.";
    if(L() === "zh-CN") return "填写时，回答会自动保存在本设备上。提交后，草稿将被删除。";
    return "入力内容はこの端末に自動保存されます。途中で閉じても再開でき、送信すると下書きは削除されます。";
  }

  function optionalDemographicsNotice(){
    if(L() === "en") return "Age and gender are optional. If entered, age must be 18 or older.";
    if(L() === "zh-CN") return "年龄与性别均为选填。如果填写年龄，请填写18岁以上。";
    return "年齢・性別の回答は任意です。年齢を入力する場合は18歳以上の数字を入力してください。";
  }

  function renderSurvey(){
    if(state.mode === "research" && !researchFiveDayCareComplete()){
      const missing=[1,2,3,4,5].filter(day=>!researchDayHasSubstantiveCare(day));
      markResearchIncomplete("survey_guard_incomplete_five_day_care",missing);
      return renderResearchIncomplete();
    }
    const st=surveyText();
    root.innerHTML=`<section class="card surveyCard">
      <h2>${esc(st.title)}</h2><p class="small">${esc(st.lead)}</p>
      <p class="small" aria-live="polite">${esc(surveyDraftNotice())}</p>
      <h3>${esc(st.sectionA)}</h3>
      <p class="small">${esc(optionalDemographicsNotice())}</p>
      <label for="surveyAge">${esc(st.age)}</label><input id="surveyAge" type="number" inputmode="numeric" min="18" max="120" step="1" placeholder="${esc(st.agePh)}">
      <label for="surveyGender">${esc(st.gender)}</label><select id="surveyGender"><option value="">${esc(st.select)}</option>${Object.entries(st.genderOptions).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select>
      <h3 style="margin-top:22px">${esc(st.sectionB)}</h3>
      ${renderLikertSelect("q1Identity",st.q1)}
      <label for="q1Replaced">${esc(st.q1sub)}</label><select id="q1Replaced" required><option value="">${esc(st.select)}</option>${Object.entries(st.replacedOptions).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select>
      <h3 style="margin-top:22px">${esc(st.sectionC)}</h3>
      <label for="q2Reason">${esc(st.q2)}</label><textarea id="q2Reason" maxlength="1200" placeholder="${esc(st.q2Ph)}" required></textarea>
      <h3 style="margin-top:22px">${esc(st.sectionD)}</h3>
      <label for="q3ChangeAwareness">${esc(st.q3)}</label><select id="q3ChangeAwareness" required><option value="">${esc(st.select)}</option>${Object.entries(st.q3Options).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select>
      <label>${esc(st.q4)}</label>${renderCheckboxGroup("q4_changes",st.q4Options)}
      <input id="q4Other" class="hidden" type="text" maxlength="300" placeholder="${esc(st.q4OtherPh)}">
      <h3 style="margin-top:22px">${esc(st.sectionE)}</h3>
      <label for="q5MostImportant">${esc(st.q5)}</label><select id="q5MostImportant" required><option value="">${esc(st.select)}</option>${Object.entries(st.q5Options).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select>
      <input id="q5Other" class="hidden" type="text" maxlength="300" placeholder="${esc(st.q5OtherPh)}">
      <h3 style="margin-top:22px">${esc(st.sectionF)}</h3><p class="small">${esc(st.sectionFLead)}</p>
      ${renderLikertSelect("q6Attachment",st.q6)}
      ${renderLikertSelect("q7Importance",st.q7)}
      ${renderLikertSelect("q8Concern",st.q8)}
      <button id="submitSurveyBtn" class="wide" type="button" style="margin-top:18px">${esc(st.submit)}</button>
    </section>`;
    // 「気づかなかった」「わからない」は他の変化との同時選択を防ぐ。
    const exclusive=new Set(["not_noticed","dont_know"]);
    document.querySelectorAll('input[name="q4_changes"]').forEach(box=>box.addEventListener("change",()=>{
      if(box.checked){
        document.querySelectorAll('input[name="q4_changes"]').forEach(other=>{
          if(other===box) return;
          if(exclusive.has(box.value) || exclusive.has(other.value)) other.checked=false;
        });
      }
      updateQ4Other();
    }));
    const updateQ4Other=()=>{
      const selected=checkedValues("q4_changes").includes("other");
      $("q4Other").classList.toggle("hidden",!selected);
      if(!selected) $("q4Other").value="";
    };
    updateQ4Other();
    $("q5MostImportant").addEventListener("change",()=>{
      const selected=$("q5MostImportant").value==="other";
      $("q5Other").classList.toggle("hidden",!selected);
      if(!selected) $("q5Other").value="";
    });
    // 入力途中の回答を復元してから、選択状況に応じて補助欄を表示します。
    restoreSurveyDraft();
    updateQ4Other();
    const q5IsOther = $("q5MostImportant").value === "other";
    $("q5Other").classList.toggle("hidden", !q5IsOther);
    if(!q5IsOther) $("q5Other").value = "";

    // 文字入力・選択のたびに即保存。オフラインでも同じ端末内に残ります。
    const card = root.querySelector(".surveyCard");
    card.addEventListener("input", saveSurveyDraft);
    card.addEventListener("change", saveSurveyDraft);
    $("submitSurveyBtn").addEventListener("click",submitSurvey);
  }

  function deriveSurveyReasonsFromKey(key){
    if(key==="appearance") return ["look"];
    if(key==="care_experience" || key==="memory") return ["memory"];
    if(key==="intuitive") return ["feeling"];
    return [key].filter(Boolean);
  }

  function validateSurvey(){
    const st=surveyText();
    const ageText = String($("surveyAge")?.value || "").trim();
    if(ageText){
      const age = Number(ageText);
      if(!Number.isInteger(age) || age < 18 || age > 120){alert(st.ageError);return false;}
    }
    if(!$("q1Identity")?.value || !$("q1Replaced")?.value ||
       !$("q2Reason")?.value.trim() || !$("q3ChangeAwareness")?.value ||
       !$("q5MostImportant")?.value || !$("q6Attachment")?.value ||
       !$("q7Importance")?.value || !$("q8Concern")?.value){alert(st.missing);return false;}
    if(!checkedValues("q4_changes").length){alert(st.q4Error);return false;}
    return true;
  }

  function submitSurvey(){
    if(!researchFiveDayCareComplete()){
      const missing=[1,2,3,4,5].filter(day=>!researchDayHasSubstantiveCare(day));
      markResearchIncomplete("survey_submit_guard_incomplete_five_day_care",missing);
      return renderResearchIncomplete();
    }
    if(!validateSurvey()) return;
    const q1Identity=Number($("q1Identity").value);
    const q1Replaced=$("q1Replaced").value; // "yes" or "no", not a Likert score
    const q4Changes=checkedValues("q4_changes");
    const q5Clue=$("q5MostImportant").value;
    const attachment=Number($("q6Attachment").value);
    const importance=Number($("q7Importance").value);
    const concern=Number($("q8Concern").value);
    state.survey={
      survey_version:"2026-10-11_docx_Q1toQ8",
      age:$("surveyAge").value.trim() ? Number($("surveyAge").value) : null,
      gender:$("surveyGender").value || "",
      q1_identity:q1Identity,q1_replaced_yesno:q1Replaced,
      q2_reason:$("q2Reason").value.trim(),q3_change_awareness:$("q3ChangeAwareness").value,
      q4_changed_aspects:q4Changes,q4_other:q4Changes.includes("other")?$("q4Other").value.trim():"",
      q5_most_important_clue:q5Clue,q5_other:q5Clue==="other"?$("q5Other").value.trim():"",
      q6_attachment:attachment,q7_importance:importance,q8_concern:concern,likert_scale:7,
      // Legacy calculation fields preserved for the participant card only.
      identity_score:q1Identity,attachment_score:attachment,concern_score:concern,
      noticed_change:$("q3ChangeAwareness").value,noticed_parts:q4Changes,
      reasons:deriveSurveyReasonsFromKey(q5Clue),free_text:$("q2Reason").value.trim(),
      identity_continuity_percent:clamp(Math.round((q1Identity-1)/6*100),0,100)
    };
    // 抽選番号は最終アンケート送信時に1度だけ発行します。
    // 当選者判定はクライアントでは行わず、必ずサーバー側の抽選で決定します。
    state.lottery_ticket_code = state.lottery_ticket_code || createLotteryTicket();
    state.lottery_joined_at = state.lottery_joined_at || new Date().toISOString();
    state.completed_survey=true;
    state.research_completion_status="survey_complete";
    state.research_completed_at=state.research_completed_at||new Date().toISOString();
    state.reward_eligible=true;
    state.lottery_result_status="pending";
    state.lottery_contact_submitted=false;
    state.screen=CONFIG.LOTTERY_IMMEDIATE_ENABLED?"lottery":"result";
    saveState();
    clearSurveyDraft(); // 正式送信が確定したので、この端末の下書きを削除します。
    logEvent("survey_submit",{
      survey:state.survey,logs:state.logs,
      research_day_care:{...ensureResearchDayCareTracking()},
      five_day_care_complete:true,reward_eligible:true,
      lottery_ticket_code:state.lottery_ticket_code,
      lottery_joined_at:state.lottery_joined_at,
      lottery_policy:CONFIG.LOTTERY_IMMEDIATE_ENABLED ? "every_50th_valid_survey" : "one_random_winner_per_50_valid_surveys",
      lottery_group_size:50,
      lottery_auto_send_gift:false,
      care_meters_total:{...state.care_meters_total},full_meter_count:state.full_meter_count,
      source:"embedded_final_survey_2026-10-11_docx"
    });
    if(CONFIG.LOTTERY_IMMEDIATE_ENABLED)renderLotteryResult();
    else renderResult();
  }

  function localLabel(obj){ return obj?.[L()] || obj?.ja || ""; }
  function localType(card){ return localLabel(card?.type) || (L()==="en" ? "Companion" : L()==="zh-CN" ? "伙伴" : "相棒"); }
  function localMessage(card){ return localLabel(card?.message) || ""; }

      zoo:`<ellipse cx="118" cy="118" rx="70" ry="39" fill="#17151d"/><circle cx="72" cy="76" r="34" fill="#17151d"/><circle cx="45" cy="54" r="15" fill="#17151d"/><circle cx="96" cy="54" r="15" fill="#17151d"/><circle cx="62" cy="75" r="4" fill="#fff" opacity=".78"/><rect x="83" y="144" width="16" height="38" rx="8" fill="#17151d"/><rect x="137" y="144" width="16" height="38" rx="8" fill="#17151d"/>`,

  function zukanImagePath(card){
    if(!card || !card.file) return "";
    return "public/assets/pets/" + card.file;
  }

  window.showMissingZukanImage = function(img){
    const label = img.dataset.label || "";
    const small = img.dataset.small === "1";
    if(small){
      img.outerHTML = `<div class="zukanMissingImage small" aria-label="${esc(label)}">?</div>`;
      return;
    }
    img.outerHTML = `<div class="zukanMissingImage" aria-label="${esc(label)}"><div><div class="zukanMissingMark">?</div><div class="zukanMissingText">画像未設定</div></div></div>`;
  };

  function companionCardTitle(card){
    const name = localLabel(card?.label);
    if(L()==="en") return `Your perfect companion is ${name}.`;
    if(L()==="zh-CN") return `最适合你的伙伴是${name}。`;
    return `あなたにぴったりな相棒は「${name}」です。`;
  }

  function companionSilhouetteHtml(card){
    const src = zukanImagePath(card);
    const label = localLabel(card?.label);
    if(!src){
      return `<div class="zukanSilhouetteWrap"><div class="zukanMissingImage" aria-label="${esc(label)}"><div><div class="zukanMissingMark">?</div><div class="zukanMissingText">画像未設定</div></div></div></div>`;
    }
    return `<div class="zukanSilhouetteWrap"><img class="zukanSilhouetteImg" draggable="false" data-no-visual-search="true" oncontextmenu="return false" src="${esc(src)}" data-label="${esc(label)}" alt="${esc(label)}" onerror="showMissingZukanImage(this)"></div>`;
  }

    const pair = dict[profile]?.[L()] || dict[profile]?.ja || dict.balanced.ja;
    return {title:pair[0], text:pair[1]};
  }
  function dominantCareProfile(){
    const l = state.logs || {};
    const values = {feed:l.feed||0, outing:l.outing||0, pet:l.pet||0, clean:l.clean||0, look:l.look||0};
    const maxKey = Object.keys(values).sort((a,b)=>values[b]-values[a])[0];
    if((l.actions_total||0) <= 6) return "occasional";
    if(state.survey?.reasons?.includes("memory") || Number(state.survey?.concern_score||0) >= 5) return "memory";
    if(maxKey === "pet" && values.pet >= 3) return "pet";
    if(maxKey === "feed" && values.feed >= 3) return "feed";
    if(maxKey === "outing" && values.outing >= 3) return "outing";
    if(maxKey === "clean" && values.clean >= 2) return "clean";
    return "balanced";
  }
  function pickZukanPet(profile){
    const groups = {
      pet:[13,17,18,21,27,47,48,50],
      feed:[1,2,3,4,11,12,32,40],
      outing:[23,25,26,29,30,33,41,45],
      clean:[5,6,7,8,9,10,31,36],
      memory:[14,15,16,24,35,42,43,44],
      occasional:[20,22,34,37,38,39,46,49],
      balanced:[18,23,27,30,41,43,48,50]
    };
    const nums = groups[profile] || groups.balanced;
    const l = state.logs || {};
    const s = state.survey || {};
    const seed =
      (l.feed||0)*3 + (l.outing||0)*5 + (l.pet||0)*7 + (l.clean||0)*11 + (l.look||0)*13 +
      Number(s.identity_score||0)*17 + Number(s.attachment_score||0)*19 + Number(s.concern_score||0)*23 +
      String(s.noticed_change||"").length*29 + (s.reasons||[]).join("").length*31 +
      String(state.research_id||"").split("").reduce((a,c)=>a+c.charCodeAt(0),0);
    const no = nums[Math.abs(seed) % nums.length];
    return PET_ZUKAN_CARDS.find(p=>p.no===no) || PET_ZUKAN_CARDS[0];
  }
  function judgeCareType(){

? "Selected as a companion card using your care log and final survey answers."

    return {profile, pet, title:txt.title, text:txt.text, basis};
  }

  function calculateCareWatchPercent(){
    const logs = state.logs || {};
    const careCount =
      Number(logs.feed || 0) +
      Number(logs.outing || 0) +
      Number(logs.pet || 0) +
      Number(logs.clean || 0);
    const watchCount = Number(logs.look || 0);
    const total = careCount + watchCount;

    // 通常は必ず操作がありますが、管理者確認などで0件の場合は中立表示にします。
    if(total <= 0){
      return {care:50, watch:50, careCount:0, watchCount:0, total:0};
    }

    const care = clamp(Math.round((careCount / total) * 100), 0, 100);
    return {
      care,
      watch:100 - care,
      careCount,
      watchCount,
      total
    };
  }

  function todayKey(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function ensureZukan(){
    state.zukan = state.zukan || {};
    state.zukan.collected = Array.isArray(state.zukan.collected) ? state.zukan.collected : [];
    if(typeof state.zukan.last_no !== "number") state.zukan.last_no = state.zukan.last_no || null;
    if(typeof state.zukan.companion_no !== "number") state.zukan.companion_no = state.zukan.companion_no || null;
    if(typeof state.zukan.heart_progress !== "number") state.zukan.heart_progress = 0;
    if(typeof state.zukan.total_hearts !== "number") state.zukan.total_hearts = 0;
    if(typeof state.zukan.gifts_today !== "number") state.zukan.gifts_today = 0;
    if(typeof state.zukan.gift_date !== "string") state.zukan.gift_date = "";
    if(typeof state.zukan.pending_reward_no !== "number") state.zukan.pending_reward_no = null;
    if(typeof state.zukan.pending_notice !== "string") state.zukan.pending_notice = "";
    normalizeZukanDaily();
    return state.zukan;
  }

  function normalizeZukanDaily(){
    if(!state.zukan) return;
    const today = todayKey();
    if(!state.zukan.gift_date){
      state.zukan.gift_date = today;
    }
    if(state.zukan.gift_date !== today){
      state.zukan.gift_date = today;
      state.zukan.gifts_today = 0;
      state.zukan.pending_notice = "";
    }
  }

  function collectOneZukanPet(force=false, source="manual"){
    const z = ensureZukan();
    if(z.collected.length >= PET_ZUKAN_CARDS.length) return null;
    if(!force) return null;
    const remaining = PET_ZUKAN_CARDS.filter(p => !z.collected.includes(p.no));
    const seed = (state.free_logs?.actions_total || 0) * 17 + Date.now();
    const card = remaining[Math.abs(seed) % remaining.length] || remaining[0];
    z.collected.push(card.no);
    z.last_no = card.no;
    saveState();
    logEvent("zukan_collect", {pet_no:card.no, pet_label:localLabel(card.label), pet_type:localType(card), collected:z.collected.length, source});
    return card;
  }

  function handleFreeCareFull(){
    const z = ensureZukan();
    const need = CONFIG.ZUKAN_HEARTS_REQUIRED;
    const limit = CONFIG.ZUKAN_DAILY_CARD_LIMIT;

    z.total_hearts = Number(z.total_hearts || 0) + 1;
    z.heart_progress = Math.min(need, Number(z.heart_progress || 0) + 1);

    // 100%達成後は、つづきのお世話で続けて遊べるように4つのお世話メーターを0%に戻します。
    resetCareMeters();

    if(z.heart_progress >= need){
      if(z.gifts_today >= limit){
        z.pending_notice = "daily_limit";
        return null;
      }

      const card = collectOneZukanPet(true, "heart3");
      if(card){
        z.gifts_today = Number(z.gifts_today || 0) + 1;
        z.heart_progress = 0;
        z.pending_reward_no = card.no;
        z.pending_notice = "";
        return card;
      }

      z.pending_notice = "complete";
    }

    return null;
  }

  function safePublicGameUrl(){
    // PCでHTMLを直接開いた際の file:///C:/... や、開発用localhostを共有しません。
    // 公開サイトでは、HTTPSのURLから検索条件やハッシュを外して共有します。
    try{
      const configured = String(CONFIG.PUBLIC_GAME_URL || "").trim();
      const u = new URL(configured || window.location.href);
      if(u.protocol !== "https:" || !u.hostname || u.hostname === "localhost" || u.hostname === "127.0.0.1") return "";
      u.search = "";
      u.hash = "";
      if(u.pathname.endsWith("/index.html")){
        u.pathname = u.pathname.replace(/index\.html$/, "");
      }
      return u.toString();
    }catch(e){
      return "";
    }
  }

  async function copyShareText(type){
    const text = shareInvitationText(type);
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
      }else{
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      showMiniToast(shareSectionText("copied"));
    }catch(e){
      alert(shareSectionText("copyFail"));
    }
  }

  async function shareToSNS(type){
    const url = safePublicGameUrl();
    const copyText = shareInvitationText(type);
    const nativeText = shareNativeText(type);

    try{
      const blob = await createShareCardBlob(type);
      const file = blob ? new File([blob], "IdealPaw_share_card.png", {type:"image/png"}) : null;

      // スマホなど、画像ファイル付き共有に対応している環境では、
      // カード画像・本文・URLをまとめて共有シートへ渡します。
      if(navigator.share){
        if(file && navigator.canShare && navigator.canShare({files:[file], title:"IdealPaw", text:nativeText, url})){
          await navigator.share({
            title:"IdealPaw",
            text:nativeText,
            url,
            files:[file]
          });
          return;
        }

        // 画像ファイル付き共有に未対応でも、本文とURLだけは共有できます。
        await navigator.share({
          title:"IdealPaw",

  function drawRoundedRect(ctx,x,y,w,h,r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.lineTo(x+w-rr,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
    ctx.lineTo(x+w,y+h-rr);
    ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
    ctx.lineTo(x+rr,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
    ctx.lineTo(x,y+rr);
    ctx.quadraticCurveTo(x,y,x+rr,y);
    ctx.closePath();
  }

  function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines=5){
    const chars = Array.from(String(text || ""));
    let line = "";
    let lines = [];
    for(const ch of chars){
      const test = line + ch;
      if(ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = ch;
        if(lines.length >= maxLines - 1) break;
      }else{
        line = test;
      }
    }
    if(line) lines.push(line);
    if(lines.length > maxLines) lines = lines.slice(0,maxLines);
    lines.forEach((ln,i)=>ctx.fillText(ln, x, y + i*lineHeight));
    return y + lines.length*lineHeight;
  }

  function imageVisibleBounds(img){
    try{
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      if(!iw || !ih) return null;
      const c = document.createElement("canvas");
      c.width = iw;
      c.height = ih;
      const cctx = c.getContext("2d");
      cctx.drawImage(img, 0, 0);
      const data = cctx.getImageData(0, 0, iw, ih).data;
      let minX = iw, minY = ih, maxX = -1, maxY = -1;
      for(let y=0; y<ih; y++){
        for(let x=0; x<iw; x++){
          const a = data[(y*iw + x)*4 + 3];
          if(a > 8){
            if(x < minX) minX = x;
            if(y < minY) minY = y;
            if(x > maxX) maxX = x;
            if(y > maxY) maxY = y;
          }
        }
      }
      if(maxX < minX || maxY < minY) return null;
      return {x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1};
    }catch(e){
      return null;
    }
  }

  function drawImageContain(ctx,img,x,y,w,h, options={}){
    if(!img) return false;
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if(!iw || !ih) return false;
    const b = imageVisibleBounds(img) || {x:0, y:0, w:iw, h:ih};
    const scale = Math.min(w/b.w, h/b.h);
    const dw = b.w * scale;
    const dh = b.h * scale;
    const dx = x + (w-dw)/2;
    const dy = y + (h-dh)/2;

    ctx.save();
    if(options.silhouette && "filter" in ctx){
      ctx.filter = "grayscale(1) brightness(0.18) contrast(2.2)";
    }
    ctx.drawImage(img, b.x, b.y, b.w, b.h, dx, dy, dw, dh);
    ctx.restore();
    return true;
  }

  async function drawShareCardCanvas(type){
    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1350;
    const ctx = canvas.getContext("2d");
    const grad = ctx.createLinearGradient(0,0,1080,1350);
    grad.addColorStop(0,"#fff9df");
    grad.addColorStop(.55,"#ffe7f0");
    grad.addColorStop(1,"#e7f7ff");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,1080,1350);

    ctx.globalAlpha = .38;
    for(let i=0;i<70;i++){
      ctx.beginPath();
      ctx.arc(Math.random()*1080, Math.random()*1350, 2 + Math.random()*5, 0, Math.PI*2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = "rgba(255,255,255,.76)";
    drawRoundedRect(ctx,80,80,920,1190,64);
    ctx.fill();

    const pet = type.pet;
    const petName = localLabel(pet.label);
    const img = await loadImageForCanvas(zukanImagePath(pet));

    ctx.fillStyle = "rgba(255,255,255,.70)";
    drawRoundedRect(ctx,230,180,620,430,64);
    ctx.fill();
    if(!drawImageContain(ctx,img,290,230,500,320,{silhouette:true})){
      ctx.fillStyle = "#746680";
      ctx.font = "bold 110px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("?", 540, 430);
    }

    ctx.textAlign = "center";
    ctx.fillStyle = "#3e3155";
    ctx.font = L()==="en" ? "bold 52px sans-serif" : "bold 50px sans-serif";
    const mainCatchLines = shareCardMainCatch(type).split("\n");
    mainCatchLines.forEach((line,i)=>ctx.fillText(line, 540, 720 + i*70));

    const url = safePublicGameUrl();
    ctx.fillStyle = "rgba(255,255,255,.82)";
    drawRoundedRect(ctx,140,970,800,140,34);
    ctx.fill();
    ctx.fillStyle = "#4b3c65";
    ctx.font = "bold 28px sans-serif";
    drawWrappedText(ctx, url, 540, 1030, 720, 40, 2);

    return canvas;
  }

      contactTitle:{ja:"解決しない場合", en:"If the problem is not resolved", "zh-CN":"如果问题仍未解决"},
      contactText:{ja:"匿名の問い合わせフォームからお知らせください。個別の返信は行わず、必要な回答はゲーム内のQ&Aに追記します。氏名や連絡先は入力しないでください。", en:"Please use the anonymous inquiry form. Individual replies will not be sent; necessary answers will be added to the in-game Q&A. Do not enter your name or contact details.", "zh-CN":"请使用匿名咨询表单。我们不会进行个人回复；必要的回答会添加到游戏内的Q&A中。请不要填写姓名或联系方式。"},
      contactButton:{ja:"問い合わせフォームを開く", en:"Open inquiry form", "zh-CN":"打开咨询表单"},
      close:{ja:"閉じる", en:"Close", "zh-CN":"关闭"}
    };
    return dict[key]?.[lang] || dict[key]?.ja || key;
  }

  function helpFaqItems(){
    const lang = L();

      ja:[
        {q:"画面が進まない", a:"ページを一度再読み込みしてください。\n改善しない場合は、ブラウザを閉じてから、もう一度同じURLを開いてください。"},
        {q:"キャラクターが出てこない", a:"通信状況によって、表示に時間がかかることがあります。\n少し待ってから、もう一度画面を開いてください。"},
        {q:"前の続きにならない", a:"同じ端末・同じブラウザで開いてください。\n別の端末や別のブラウザで開くと、前の続きにならないことがあります。"},
        {q:"キャラクターの様子が変わった気がする", a:"ゲームの中では、日によってキャラクターの様子や反応が変わって見えることがあります。\n感じたことは、最後のアンケートでそのまま答えてください。"},
        {q:"アンケートに進めない", a:"5日間すべての日に実際のお世話をした場合、5日目の最後にアンケート画面へ進みます。\n途中の日のお世話がない場合は、研究パートはそこで終了し、つづきのお世話だけ遊べます。"},
        {q:"SNSに投稿できない", a:"画像を保存してから、ご自身でSNSアプリを開いて投稿してください。\nSNSへ自動で投稿されることはありません。"}
      ],
      en:[
        {q:"The screen does not move forward", a:"Reload the page once.\nIf it still does not improve, close the browser and open the same URL again."},
        {q:"The character does not appear", a:"Depending on the connection, it may take some time to appear.\nPlease wait a little, then open the screen again."},
        {q:"It does not continue from where I left off", a:"Please open it on the same device and in the same browser.\nIf you open it on a different device or browser, it may not continue from the previous state."},
        {q:"The character seems different", a:"In the game, the character’s appearance or responses may seem different depending on the day.\nPlease answer what you felt in the final survey."},
        {q:"I cannot proceed to the survey", a:"The final survey appears only when actual care was completed on all five study days.\nIf a study day was missed, the research part ends and you can still use Continued Care."},
        {q:"I cannot post to SNS", a:"Please save the image first, then open your SNS app and post it yourself.\nIt will not be posted automatically to SNS."}
      ],
      "zh-CN":[
        {q:"画面无法继续", a:"请重新加载页面一次。\n如果仍然没有改善，请关闭浏览器后，再次打开同一个URL。"},
        {q:"角色没有出现", a:"根据通信状况，显示可能需要一些时间。\n请稍等一下，然后再次打开画面。"},
        {q:"不能从上次继续", a:"请使用同一设备和同一浏览器打开。\n如果用其他设备或其他浏览器打开，可能无法从上次的状态继续。"},
        {q:"感觉角色的样子变了", a:"在游戏中，角色的样子或反应可能会根据日期而看起来不同。\n请在最后的问卷中，按自己的感受回答。"},
        {q:"无法进入问卷", a:"只有五个研究日都完成了实际照护时，才会在第5天最后进入问卷。\n如果漏掉了某一天，研究部分会结束，但仍可继续自由照护。"},
        {q:"无法发布到SNS", a:"请先保存图片，然后自己打开SNS应用进行发布。\n不会自动发布到SNS。"}
      ]
    };
    return items[lang] || items.ja;
  }

  function updateHelpFaqButtonText(){
    const btn = $("helpFaqBtn");
    if(!btn) return;
    btn.textContent = "?";
    btn.title = helpFaqText("title");
    btn.setAttribute("aria-label", helpFaqText("title"));
  }

  function openHelpFaqModal(){
    $("helpFaqTitle").textContent = helpFaqText("title");
    $("helpFaqIntro").textContent = helpFaqText("intro");
    $("helpFaqPrivacy").textContent = helpFaqText("privacy");
    $("helpFaqCloseBtn").textContent = helpFaqText("close");
    $("helpFaqList").innerHTML = helpFaqItems().map(item => `
      <details class="helpFaqItem">
        <summary>${esc(item.q)}</summary>
        <p>${esc(item.a)}</p>
      </details>`).join("");
    $("helpContactBox").innerHTML = `
      <strong>${esc(helpFaqText("contactTitle"))}</strong>
      <div>${esc(helpFaqText("contactText"))}</div>
      <a class="button helpContactButton"
         href="${esc(CONFIG.CONTACT_FORM_URL)}"
         target="_blank"
         rel="noopener noreferrer">${esc(helpFaqText("contactButton"))}</a>`;
    $("helpFaqModal").classList.remove("hidden");
  }

  let deferredInstallPrompt = null;

  function installText(key){
    const lang = L();
    const dict = {
      button:{ja:"ホーム画面に追加", en:"Keep on home screen", "zh-CN":"保留在主屏幕"},
      title:{ja:"ホーム画面に追加", en:"Keep on your home screen", "zh-CN":"保留在主屏幕"},
      run:{ja:"ホーム画面に追加", en:"Add to home screen", "zh-CN":"添加到主屏幕"},
      close:{ja:"閉じる", en:"Close", "zh-CN":"关闭"},
      text:{ja:"このゲームをスマホのホーム画面にアイコンとして残せます。次回からアプリのように開けます。", en:"You can keep this game as an icon on your phone’s home screen and open it like an app next time.", "zh-CN":"可以把这个游戏作为图标保存到手机主屏幕，下次像应用一样打开。"},
android:{ja:"Android / Chrome の場合：このボタンで追加画面が出ます。出ない場合は、ブラウザ右上のメニューから「ホーム画面に追加」を選んでください。", en:"Android / Chrome: this button may open the install prompt. If it does not, open the browser menu and choose Add to Home screen.", "zh-CN":"Android / Chrome：这个按钮可能会打开添加提示。如果没有出现，请从浏览器菜单选择“添加到主屏幕”。"},
      ios:{ja:"iPhone / Safari の場合：下の共有ボタンを押して「ホーム画面に追加」を選んでください。iPhoneではWebページ側から自動で追加画面を出せません。", en:"iPhone / Safari: tap the Share button and choose Add to Home Screen. iPhone does not allow websites to open this prompt automatically.", "zh-CN":"iPhone / Safari：请点击分享按钮，然后选择“添加到主屏幕”。iPhone 不允许网页自动打开这个提示。"},
      done:{ja:"追加画面を開きました。", en:"Install prompt opened.", "zh-CN":"已打开添加提示。"},
      unavailable:{ja:"この端末では自動追加画面を開けません。説明に沿って、ブラウザのメニューから追加してください。", en:"This device cannot open the install prompt automatically. Please use the browser menu as described.", "zh-CN":"这台设备无法自动打开添加提示。请按照说明从浏览器菜单添加。"}
    };
    return dict[key]?.[lang] || dict[key]?.ja || key;
  }

  function updateInstallButtonText(){
    const btn = $("installAppBtn");
    if(btn) btn.textContent = installText("button");
  }

  function openInstallModal(){
    $("installTitle").textContent = installText("title");
    $("installText").textContent = installText("text");
    $("installHelp").innerHTML = `${esc(installText("android"))}<br><br>${esc(installText("ios"))}`;
    $("installRunBtn").textContent = installText("run");
    $("installCloseBtn").textContent = installText("close");
    $("installModal").classList.remove("hidden");
  }

  async function runInstallPrompt(){
    if(deferredInstallPrompt){
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      promptEvent.prompt();
      try{ await promptEvent.userChoice; }catch(e){}
      showMiniToast(installText("done"));
      $("installModal").classList.add("hidden");
      return;
    }
    alert(installText("unavailable"));
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  function restoreRoute(){
    $("appVersion").textContent = CONFIG.APP_VERSION;

    // v32移行：既存参加者には新しい研究IDを発行せず、
    // 既存状態に「再開用内部キー」だけを追加して、そのまま影バックアップします。
    if(state && state.research_id){
      const resumeKeysAdded = ensureResumeKeys();
      if(resumeKeysAdded){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
      scheduleStateBackup(resumeKeysAdded ? "v32_migration_existing_participant" : "app_open");
    }

    syncLifeClock();
    if(!state.research_id){ state.screen = "intro"; saveState(); return renderIntro(); }
    if(state.completed_survey && state.mode === "research"){
      if(CONFIG.LOTTERY_IMMEDIATE_ENABLED && state.screen==="lottery")return renderLotteryResult();
      state.screen="result";saveState();return renderResult();
    }
    if(state.mode === "research" && state.research_completion_status === "incomplete"){
      state.screen = "incomplete";
      saveState();
      return renderResearchIncomplete();
    }
    if(openSurveyAfterDay5()) return;
    if(state.mode === "free"){
      if(!state.gift_opened_at){ state.screen = "gift"; saveState(); return renderGift(); }
      if(!state.hatch_at){ return startHatching(); }
      if(!state.pet_name){ state.screen = "namePet"; saveState(); return renderNamePet(); }
      state.screen = state.screen === "zukan" ? "zukan" : "game";
      saveState();
      return state.screen === "zukan" ? renderZukanCollection() : renderGame("look");
    }
    if(!state.gift_opened_at){ state.screen = "gift"; saveState(); return renderGift(); }
    if(!state.hatch_at){ return startHatching(); }
    if(!state.pet_name){ state.screen = "namePet"; saveState(); return renderNamePet(); }
    if(!state.care_started_at){ state.care_started_at = state.hatch_at; }
    if(!state.life_day_marker){ state.life_day_marker = `research-${currentDay()}`; }
    ensureCareMeters();
    ensureResearchDayCareTracking();
    if(!state.last_care_at){ state.last_care_at = state.care_started_at || state.hatch_at; }
    if(routeToResearchIncompleteIfNeeded("restore_route_missing_day")) return;
    if(needsLetterReturnSequence(currentDay())){
      return ensureLetterReturnSequence(currentDay());
    }
    if(state.mode === "research" && currentDay() === 3 && state.letter_shown_at && !state.return_completed){
      if(state.screen === "miniGame" && predictionAllowed()) return renderPredictionGame();
      state.screen = "letter";
      saveState();
      return renderLetter();
    }
    if(state.screen === "miniGame" && predictionAllowed()) return renderPredictionGame();
    state.screen = "game";
    saveState();
    renderGame("look");
  }

  if($("installAppBtn")) $("installAppBtn").addEventListener("click", openInstallModal);
  if($("helpFaqBtn")) $("helpFaqBtn").addEventListener("click", openHelpFaqModal);
  if($("helpFaqCloseBtn")) $("helpFaqCloseBtn").addEventListener("click", () => $("helpFaqModal").classList.add("hidden"));
  if($("helpFaqModal")) $("helpFaqModal").addEventListener("click", (e) => { if(e.target && e.target.id === "helpFaqModal") $("helpFaqModal").classList.add("hidden"); });
  if($("installCloseBtn")) $("installCloseBtn").addEventListener("click", () => $("installModal").classList.add("hidden"));
  if($("installRunBtn")) $("installRunBtn").addEventListener("click", runInstallPrompt);

  $("choiceClose").addEventListener("click", () => $("choiceModal").classList.add("hidden"));
  $("renameSubmit").addEventListener("click", () => {
    const name = ($("renameInput").value || "").trim() || (L()==="en" ? "Buddy" : L()==="zh-CN" ? "角色" : "キャラクター");
    state.pet_name = name;
    state.renamed_after_change = true;
    $("renameModal").classList.add("hidden");
    saveState();
    logEvent("rename_after_change", {pet_name_entered:true});
    renderGame("look");
  });
  updateInstallButtonText();
  disableBrowserImageSearch(document);
  restoreRoute();
  // 既存の研究ID・保存状態はそのまま、未送信キューだけを再試行する。
  setTimeout(flushDeliveryOutbox, 1200);
  window.addEventListener("online", flushDeliveryOutbox);
  setTimeout(updateCareAttentionIndicator, 0);

  // 画面を閉じる・バックグラウンドへ移る直前にも、可能な範囲で最新状態を送ります。
  window.addEventListener("pagehide", () => {
    saveSurveyDraft();
    sendStateBackup("pagehide", true);
  });
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "hidden"){
      saveSurveyDraft();
      sendStateBackup("visibility_hidden", true);
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
})();
</script>
