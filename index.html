<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdealPaw 抽選Worker 接続確認</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#342849}
body{margin:0;padding:32px 16px;min-height:100vh;background:linear-gradient(145deg,#fff9e9,#fde9f6)}
main{max-width:520px;margin:35px auto;padding:28px 23px;border-radius:24px;background:white;box-shadow:0 14px 35px #3e315522}
h1{font-size:1.45rem;margin-top:0}p{line-height:1.8}button{background:#e477a6;color:white;border:0;border-radius:22px;padding:14px 20px;font-size:16px;font-weight:700;width:100%;cursor:pointer}
button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f3fc;border-radius:12px;padding:14px;font-size:13px}
.ok{color:#187044;font-weight:bold}.err{color:#b22e49;font-weight:bold}
.small{font-size:13px;color:#695a78}
</style></head><body><main>
<h1>IdealPaw 抽選Worker 接続確認</h1>
<p>ゲーム本体や研究データを変更せず、Cloudflare WorkerとGASの疎通だけを確認します。</p>
<p class="small">このページをGitHub Pages（許可済みの https://biyumiwa.github.io 上）に置いて開いてください。パソコン内で直接開くと接続が拒否されます。</p>
<button id="testBtn" type="button">接続を確認する</button>
<p id="result" aria-live="polite"></p>
<pre id="details" hidden></pre>
<p class="small">ダミーの無効な研究IDを送信します。メールアドレスは送信しません。当選判定や回答データの作成は行いません。</p>
</main><script>
const ENDPOINT='https://idealpaw-immediate-prize.ipaw-research26.workers.dev';
const btn=document.getElementById('testBtn');
const result=document.getElementById('result');
const details=document.getElementById('details');
btn.addEventListener('click',async()=>{
  btn.disabled=true;result.className='';result.textContent='接続を確認しています…';details.hidden=true;
  try{
    const response=await fetch(ENDPOINT,{
      method:'POST',mode:'cors',cache:'no-store',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'status',research_id:'TEST',lottery_ticket_code:'TEST'})
    });
    const body=await response.json();
    details.hidden=false;
    details.textContent='HTTP '+response.status+' / '+JSON.stringify(body);
    if(response.ok && body && body.ok===false && body.code==='invalid_identifier'){
      result.className='ok';
      result.textContent='✅ 接続成功：Cloudflare WorkerからGASまで応答を確認できました。';
    }else{
      result.className='err';
      result.textContent='接続の確認が完了しませんでした。上の結果を確認してください。';
    }
  }catch(e){
    result.className='err';
    result.textContent='接続できませんでした。GitHub Pagesで開いたか、許可するオリジンを確認してください。';
    details.hidden=false;details.textContent=String(e);
  }finally{btn.disabled=false;}
});
</script></body></html>
